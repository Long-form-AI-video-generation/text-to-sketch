name: anime_tok_dict_finetune
description: Fine-tune the in-repo tok-dict Sketchformer model on anime token data.

run:
  id: anime-tok-dict-finetune
  output_dir: weights/finetuned/sketchformer-tok-dict-anime
  resume_from_checkpoint: null

pretrained:
  use_converted_sketchformer_weights: true
  path: weights/pretrained/sketchformer_tok_dict_init.safetensors
  strict: false

overrides:
  data:
    sequence:
      max_length: 2048
      target_max_length: 2048
    batching:
      batch_size: 2
      eval_batch_size: 2
      num_workers: 4
  trainer:
    training:
      max_epochs: 20
      log_every_n_steps: 50
      accumulate_grad_batches: 4
    checkpointing:
      monitor: val/token_loss
      filename: epoch_{epoch:03d}-val_token_{val/token_loss:.4f}
      save_top_k: 3
  optimizer:
    optimizer:
      lr: 0.00005
    scheduler:
      warmup_steps: 1000

evaluation:
  primary_metric: val/token_loss
  generate_reconstruction_plots: true
  generate_svg_samples: true

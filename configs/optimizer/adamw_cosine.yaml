name: adamw_cosine

optimizer:
  type: adamw
  lr: 0.0001
  weight_decay: 0.01
  betas:
    - 0.9
    - 0.95
  eps: 0.00000001

scheduler:
  type: cosine_with_warmup
  warmup_steps: 1000
  min_lr: 0.000001
  interval: step
  frequency: 1

gradient:
  clip_value: null
  clip_norm: 1.0
  accumulate_batches: 1

loss_weights:
  token: 1.0
  reconstruction: 1.0
  pen_state: 1.0
  classification: 0.0
  kl: 0.0
